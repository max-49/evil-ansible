---
# Ansible for deploying tools during RITSEC Red Team competitions
- name: Deploy ZeroPAM
  hosts: linux
  become: yes
  tasks:
    - include_role:
        name: deploy_zeropam
  tags:
    - zeropam

- name: Deploy Sliver on Linux
  hosts: linux
  become: yes
  tasks:
    - include_role:
        name: deploy_sliver_linux
  tags:
    - sliver
    - sliver_linux

- name: Deploy Sliver on Windows
  hosts: windows
  tasks:
    - include_role:
        name: deploy_sliver_windows
  tags:
    - sliver
    - sliver_windows

- name: Deploy Sliver on FreeBSD
  hosts: freebsd
  become: yes
  tasks:
    - include_role:
        name: deploy_sliver_freebsd
  tags:
    - sliver
    - sliver_freebsd
