- name: Add exclusion to APT to prevent reinstall of PAM
  ansible.builtin.copy:
    src: "ubuntu-pro-pam-esm"
    dest: /etc/apt/preferences.d/ubuntu-pro-pam-esm
    owner: root
    group: root
    mode: 0644