---
- name: Create silver directory
  ansible.windows.win_file:
    path: C:\Program Files\silver
    state: directory

- name: Copy silver binary
  ansible.windows.win_copy:
    src: silver.exe
    dest: C:\Program Files\silver\silver.exe
    force: true

- name: Create the Windows service if it does not exist
  ansible.windows.win_command: >
    sc.exe create "Silver Logging" 
    binPath= "C:\Program Files\silver\silver.exe" 
    start= auto 
    DisplayName= "Silver Logging"
  register: service_creation
  failed_when: 
    - service_creation.rc != 0
    - "'already exists' not in service_creation.stderr"
  changed_when: "'success' in service_creation.stdout|lower"

- name: Ensure the service is started and running
  ansible.windows.win_service:
    name: "Silver Logging"
    start_mode: automatic
    state: started